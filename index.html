<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>افتتاحیه داروخانه دکتر غلامی</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0ebe5;
            display: flex;
            justify-content: center;
            align-items: center;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            font-family: Tahoma, sans-serif;
        }

        .card {
            height: 100vh;
            max-width: 520px;
            width: auto;

            background: #ffffff;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.10);
        }

        .image-wrapper {
            position: relative;
            height: 100%;
        }

        .image-wrapper img {
            display: block;

            width: auto;
            height: 100vh;

            max-width: 100vw;

            object-fit: contain;
        }

        .location-link {
            position: absolute;

            /* جای دکمه نسبت به تصویر */
            left: 25%;
            top: 81%;

            width: 50%;
            height: 6%;

            display: block;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .card {
                width: 100%;
                height: 100vh;
            }

            .image-wrapper img {
                width: 100%;
                height: 100vh;
                object-fit: contain;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="image-wrapper">

            <img
                src="1.png"
                alt="افتتاحیه داروخانه دکتر غلامی"
            />

            <a
                class="location-link"
                href="https://www.google.com/maps/search/?api=1&query=37.255278%2C49.946225"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="مشاهده لوکیشن و مسیریابی">
            </a>

        </div>

    </div>

</body>

</html>
