<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>افتتاحیه داروخانه دکتر غلامی</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0ebe5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Tahoma, sans-serif;
        }

        .card {
            max-width: 520px;
            width: 100%;
            background: #ffffff;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .location-link {
            position: absolute;

            /* جای دکمه نسبت به تصویر */
            left: 22%;
            top: 79%;

            width: 55%;
            height: 6%;

            display: block;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="image-wrapper">

            <img 
                src="2.png"
                alt="افتتاحیه داروخانه دکتر غلامی"
            />

            <a
                class="location-link"
                href="https://maps.app.goo.gl/8PRu2RGRhPDCW9Az9"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="مشاهده لوکیشن و مسیریابی"
            ></a>

        </div>

    </div>

</body>
</html>
